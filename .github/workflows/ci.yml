# OmniFlux CI — the Codebreaker Law 12 checklist, enforced by machines
# instead of memory. The test jobs install ffmpeg so the decode integration
# test runs for real (and FAILS the build if the pipe stops working) instead
# of skipping silently.
#
# NOTE: these action pins are the current majors at time of writing; they are
# validated the first time this workflow runs against a real remote — if a
# major has since moved, fix the pin rather than disabling the check.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt-and-lint:
    runs-on: ubuntu-latest
    # Every job carries a ceiling: a hung test must fail the build in minutes,
    # not burn a runner for hours (the default is 6 h). A hang is a bug to fix,
    # not a wait to sit through.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: install ffmpeg (the decode test decodes a real clip)
        shell: bash
        run: |
          if command -v apt-get > /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          else
            choco install ffmpeg -y
          fi
        # NOTE (2026-11-10): on Windows, `choco install ffmpeg` puts a SHIM on
        # PATH — the process the spike spawns is a wrapper, not ffmpeg itself
        # ("ShimGen has successfully created a shim for ffmpeg.exe" in the
        # install log). The spike survives that: shutdown closes the decoder's
        # stdin FIRST, so EOF reaches the real binary behind the wrapper.
        # If a test hangs here, suspect a wrapper process before suspecting
        # the protocol — that was exactly the 15-minute hang this note records.
      - run: cargo nextest run

  audit:
    # cargo-audit = RustSec advisory database gate (Law 4: known CVEs block).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    # cargo-deny = the local deny.toml rules (licenses/bans) as an action.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
