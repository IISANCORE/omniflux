# cargo-deny configuration — Law 4 (dependencies are a public trust).
# Every section states WHY it exists. Kept minimal on purpose: rules we
# don't need are worse than none, because nobody reads them.

[advisories]
# Known vulnerabilities in the dependency tree fail the check (and CI).
# This is the machine-enforced half of Law 4's "audit blocks merges".
version = 2

[licenses]
# Dependency licenses the engine may lawfully consume (mainstream FOSS).
# The LIST grows by editing this file, with a comment, never by magic.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    # OmniFlux itself, declared in the member manifests — repository LICENSE
    # carries the full GPL-3.0 text (decision landed 2026-11-09).
    "GPL-3.0-or-later",
    # epaint_default_fonts (the bundled-font crate egui pulls in): the default
    # UI font family is licensed with OFL-1.1 (the glyphs the prototype
    # displays) and Ubuntu-font-1.0 (the Ubuntu face used for UI text). The
    # fonts are part of the display of the product; the lock lists them only
    # because the egui tree is new.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# NOTE: until there are external dependencies every entry above is
# "unused" — cargo-deny warns about that per run; the warnings stay ON,
# they are the reminder that this list exists for a future state.

# The licensing decision DID land (2026-11-09): GPL-3.0-or-later, so there
# is no `[licenses.private]` waiver anymore — our own crates pass through
# the same license check every dependency does.
