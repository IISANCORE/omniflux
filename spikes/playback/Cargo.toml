[package]
name = "playback-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
# workspace-internal crate: OmniFlux ships as a product, not as a crates.io
# package, so publish = false states that and blocks accidental `cargo
# publish` (kept unchanged across the GPL-3.0-or-later decision, 2026-11-09).
publish = false

# omniflux-core: exercises the workspace wiring; the spike will consume real
# engine primitives as they land.
[dependencies]
omniflux-core = { path = "../../crates/omniflux-core" }

[lib]
name = "playback_spike"
path = "src/lib.rs"

[[bin]]
name = "playback-spike"
path = "src/main.rs"
