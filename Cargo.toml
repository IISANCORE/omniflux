# OmniFlux workspace — every crate below is one auditable unit (Codebreaker Law 4: no member gets deps without a stated reason).
[workspace]
resolver = "2"
members = ["crates/omniflux-core", "spikes/playback", "spikes/timeline"]

[workspace.package]
edition = "2021"
# The open FOSS decision landed 2026-11-09 (project owner's call):
# GPL-3.0-or-later. The full text is the repository's LICENSE file; every
# member inherits the SPDX expression from here.
license = "GPL-3.0-or-later"
